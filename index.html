<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تَدَبُّر — منصة التدبر القرآني</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* CSS Variables for Dynamic Theme Switching */
    :root[data-theme="dark"] {
      --bg-main: #0d1b1e;
      --card-bg: rgba(22, 42, 45, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.15);
      --accent-gold: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --quran-text: #ecfdf5;
      --input-bg: rgba(13, 27, 30, 0.85);
      --wisdom-bg: rgba(245, 158, 11, 0.08);
      --wisdom-border: rgba(245, 158, 11, 0.25);
      --wisdom-text: #fef3c7;
      --quran-bg: rgba(16, 185, 129, 0.06);
      --shadow-color: rgba(0, 0, 0, 0.3);
    }

    :root[data-theme="light"] {
      --bg-main: #f4f7f6;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.08);
      --primary-emerald: #059669;
      --emerald-glow: rgba(5, 150, 105, 0.12);
      --accent-gold: #d97706;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --quran-text: #064e3b;
      --input-bg: #f9fafb;
      --wisdom-bg: #fffbe3;
      --wisdom-border: #fcd34d;
      --wisdom-text: #78350f;
      --quran-bg: #ecfdf5;
      --shadow-color: rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }

    body {
      font-family: 'Readex Pro', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    /* Top Bar & Theme Toggle */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo-tag {
      display: inline-block;
      padding: 6px 16px;
      background: var(--emerald-glow);
      border: 1px solid var(--primary-emerald);
      color: var(--primary-emerald);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px var(--shadow-color);
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Range Filter Box */
    .search-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 15px 35px var(--shadow-color);
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .range-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-emerald);
      margin-bottom: 6px;
      display: block;
    }

    .range-group {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    select, input {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      width: 100%;
    }

    select:focus, input:focus {
      border-color: var(--primary-emerald);
      box-shadow: 0 0 0 3px var(--emerald-glow);
    }

    .actions-grid {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary-emerald);
      color: #ffffff;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      border-color: var(--primary-emerald);
      transform: translateY(-1px);
    }

    /* Cards */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .tadabbur-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 10px 30px var(--shadow-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--primary-emerald);
    }

    .quran-box {
      background: var(--quran-bg);
      border-right: 4px solid var(--primary-emerald);
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    .quran-text {
      font-family: 'Amiri', serif;
      font-size: 1.6rem;
      line-height: 2.3;
      color: var(--quran-text);
      text-align: justify;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .meaning-text {
      line-height: 1.9;
      color: var(--text-main);
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 300;
    }

    .wisdom-box {
      background: var(--wisdom-bg);
      border: 1px solid var(--wisdom-border);
      padding: 16px;
      border-radius: 14px;
      color: var(--wisdom-text);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .wisdom-title {
      color: var(--accent-gold);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px dashed var(--card-border);
      color: var(--text-muted);
    }

    .skeleton {
      animation: pulse 1.5s infinite ease-in-out;
      background: var(--card-border);
      border-radius: 16px;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    @media (max-width: 640px) {
      .filter-grid { grid-template-columns: 1fr; }
      .actions-grid { flex-direction: column; }
      h1 { font-size: 1.8rem; }
      .quran-text { font-size: 1.35rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <span class="logo-tag">تطبيق تدبر الذكي</span>
      <button class="theme-toggle-btn" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span>
        <span id="themeText">الوضع الفاتح</span>
      </button>
    </div>

    <header>
      <h1>تَدَبُّر آيَاتِ القُرْآن</h1>
      <p class="subtitle">تأملات ومعانٍ عملية بالعامية المصرية الراقية</p>
    </header>

    <!-- Range Search Panel -->
    <div class="search-panel">
      <div class="filter-grid">
        <!-- Start Point -->
        <div>
          <label class="range-label">من (البداية):</label>
          <div class="range-group">
            <select id="startSurah">
              <option value="1">1. الفاتحة</option>
              <option value="2">2. البقرة</option>
              <option value="3">3. آل عمران</option>
            </select>
            <input type="number" id="startAyah" placeholder="آية رقم" min="1">
          </div>
        </div>

        <!-- End Point -->
        <div>
          <label class="range-label">إلى (النهاية):</label>
          <div class="range-group">
            <select id="endSurah">
              <option value="1">1. الفاتحة</option>
              <option value="2">2. البقرة</option>
              <option value="3">3. آل عمران</option>
            </select>
            <input type="number" id="endAyah" placeholder="آية رقم" min="1">
          </div>
        </div>
      </div>

      <!-- Keyword Filter -->
      <div>
        <input type="text" id="searchInput" placeholder="بحث بكلمة في التدبر والمعنى..." oninput="searchTadabbur()">
      </div>

      <div class="actions-grid">
        <button class="btn btn-primary" onclick="searchTadabbur()">
          🔍 عرض النتائج
        </button>
        <button class="btn btn-secondary" onclick="fetchRandom()">
          🎲 مقطع عشوائي
        </button>
      </div>
    </div>

    <!-- Results Area -->
    <div id="content" class="results-container"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://imundmzbhyarqdwlzgnm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_b78kWQraA3NXVfOVe9UNmA_GpnPizjs";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Initialize Theme and Search on Load
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      searchTadabbur();
    });

    // Theme Switcher Logic
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeUI(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeUI(newTheme);
    }

    function updateThemeUI(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'الوضع الفاتح';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'الوضع الداكن';
      }
    }

    // Flexible Range Search Logic
    async function searchTadabbur() {
      const container = document.getElementById('content');
      showSkeleton(container);

      const startS = parseInt(document.getElementById('startSurah').value);
      const startA = parseInt(document.getElementById('startAyah').value) || 1;
      
      const endS = parseInt(document.getElementById('endSurah').value) || startS;
      const endA = parseInt(document.getElementById('endAyah').value) || 999;
      
      const searchKeyword = document.getElementById('searchInput').value.trim();

      let query = _supabase.from('tadabbur_blocks').select('*');

      // Filter blocks overlapping with the specified range
      query = query.gte('end_surah', startS)
                   .lte('start_surah', endS);

      if (searchKeyword !== "") {
        query = query.ilike('deep_meaning', `%${searchKeyword}%`);
      }

      const { data, error } = await query;

      if (error) {
        container.innerHTML = `
          <div class="empty-state">
            <p>❌ حدث خطأ في جلب البيانات، يرجى المحاولة مرة أخرى.</p>
          </div>`;
        return;
      }

      // Filter Ayah boundaries locally for cross-Surah flexibility
      const filtered = data.filter(item => {
        const afterStart = (item.start_surah > startS) || (item.start_surah === startS && item.end_ayah >= startA);
        const beforeEnd = (item.end_surah < endS) || (item.end_surah === endS && item.start_ayah <= endA);
        return afterStart && beforeEnd;
      });

      renderResults(filtered);
    }

    async function fetchRandom() {
      const container = document.getElementById('content');
      showSkeleton(container);

      const { data, error } = await _supabase.from('tadabbur_blocks').select('*');

      if (error || !data || data.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>لا توجد مقاطع متوفرة حالياً.</p></div>`;
        return;
      }

      const randomBlock = [data[Math.floor(Math.random() * data.length)]];
      renderResults(randomBlock);
    }

    function renderResults(data) {
      const container = document.getElementById('content');

      if (!data || data.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>لم نجد نتائج مطابقة لنطاق الآيات المحدد</h3>
            <p style="margin-top: 8px;">جرب تعديل رقم الآية أو اختيار سورة أخرى.</p>
          </div>`;
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="tadabbur-card">
          <div class="card-header">
            <div class="card-title">${item.title}</div>
          </div>
          
          <div class="quran-box">
            <div class="quran-text">${item.quran_text}</div>
          </div>

          <div class="section-title">✨ الشرح والتأمل العميق</div>
          <p class="meaning-text">${item.deep_meaning}</p>

          <div class="wisdom-box">
            <div class="wisdom-title">💡 العمل بالآية والتطبيق اليومي:</div>
            <div>${item.practical_wisdom}</div>
          </div>
        </div>
      `).join('');
    }

    function showSkeleton(container) {
      container.innerHTML = `
        <div class="tadabbur-card skeleton" style="height: 220px;"></div>
      `;
    }
  </script>
</body>
</html>
