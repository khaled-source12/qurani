<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تَدَبُّر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

    .read-time{font-size:.7rem;color:var(--text-3);display:flex;align-items:center;gap:3px;margin-top:3px}
    
    :root[data-theme="dark"] {
      --bg: #090f11; --surface: #111c20; --card: rgba(16,30,34,0.85);
      --border: rgba(255,255,255,0.06); --border-hover: rgba(255,255,255,0.12);
      --emerald: #10b981; --emerald-dim: rgba(16,185,129,0.1); --emerald-strong: rgba(16,185,129,0.2);
      --gold: #f59e0b; --gold-dim: rgba(245,158,11,0.07); --gold-border: rgba(245,158,11,0.18); --gold-text: #fef3c7;
      --text: #eef0f2; --text-2: #8b949e; --text-3: #5a6570;
      --quran-color: #d1fae5; --quran-bg: rgba(16,185,129,0.04);
      --input: rgba(8,14,16,0.9); --shadow: rgba(0,0,0,0.5);
      --overlay: rgba(0,0,0,0.6);
    }
    :root[data-theme="light"] {
      --bg: #f6f8f7; --surface: #edf0ee; --card: #fff;
      --border: rgba(0,0,0,0.06); --border-hover: rgba(0,0,0,0.12);
      --emerald: #059669; --emerald-dim: rgba(5,150,105,0.08); --emerald-strong: rgba(5,150,105,0.15);
      --gold: #b45309; --gold-dim: #fefce8; --gold-border: #fcd34d; --gold-text: #713f12;
      --text: #171f24; --text-2: #5f6b73; --text-3: #9ca3af;
      --quran-color: #064e3b; --quran-bg: #f0fdf4;
      --input: #f8faf9; --shadow: rgba(0,0,0,0.04);
      --overlay: rgba(255,255,255,0.7);
    }

    :root[data-theme="sepia"] {
  --bg: #1a1510; --surface: #231e17; --card: rgba(35,30,23,0.9);
  --border: rgba(255,220,160,0.08); --border-hover: rgba(255,220,160,0.15);
  --emerald: #d4a053; --emerald-dim: rgba(212,160,83,0.1); --emerald-strong: rgba(212,160,83,0.2);
  --gold: #e8a849; --gold-dim: rgba(232,168,73,0.08); --gold-border: rgba(232,168,73,0.18); --gold-text: #fef3c7;
  --text: #e8dcc8; --text-2: #a89880; --text-3: #6d5f4e;
  --quran-color: #f0e0c0; --quran-bg: rgba(212,160,83,0.05);
  --input: rgba(18,14,10,0.9); --shadow: rgba(0,0,0,0.5);
  --overlay: rgba(0,0,0,0.6);
}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Readex Pro',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}

    /* ── Utility ── */
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}

    /* ── Top Bar ── */
    .topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;backdrop-filter:blur(12px)}
    .topbar-right{display:flex;align-items:center;gap:8px}
    .logo{font-weight:700;font-size:1.15rem;color:var(--emerald)}
    .icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;border:1px solid var(--border);transition:border-color .2s,background .2s}
    .icon-btn:hover{border-color:var(--emerald);background:var(--emerald-dim)}
    .icon-btn.active{background:var(--emerald-dim);border-color:var(--emerald)}

    /* ── Layout ── */
    .app{max-width:780px;margin:0 auto;padding:20px 16px 80px}

    /* ── Tabs ── */
    .tabs{display:flex;gap:4px;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:22px}
    .tab{flex:1;padding:10px;border-radius:9px;font-size:.85rem;font-weight:500;text-align:center;color:var(--text-2);transition:all .2s}
    .tab.active{background:var(--card);color:var(--emerald);box-shadow:0 2px 8px var(--shadow)}

    /* ── Daily Hero ── */
    .hero{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 24px;margin-bottom:24px;box-shadow:0 4px 20px var(--shadow)}
    .hero-label{font-size:.78rem;color:var(--emerald);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:6px}
    .hero .quran-box{margin-bottom:16px}
    .hero-title{font-size:1.05rem;font-weight:600;color:var(--text);margin-bottom:10px}
    .hero-excerpt{color:var(--text-2);font-size:.9rem;line-height:1.8;font-weight:300;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .hero-cta{margin-top:16px;padding:10px 20px;background:var(--emerald);color:#fff;border-radius:10px;font-weight:600;font-size:.85rem}

    /* ── Range Picker ── */
    .picker{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:22px;box-shadow:0 2px 12px var(--shadow)}
    .picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .picker label{font-size:.75rem;font-weight:600;color:var(--emerald);margin-bottom:4px;display:block}
    .picker-row{display:grid;grid-template-columns:1fr 80px;gap:6px}
    select,input[type="number"]{background:var(--input);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;font-size:.85rem;font-family:inherit;outline:none;width:100%;transition:border-color .2s}
    select:focus,input:focus{border-color:var(--emerald)}
    .picker-btn{width:100%;padding:11px;background:var(--emerald);color:#fff;border-radius:10px;font-weight:600;font-size:.87rem}
    .picker-error{color:#f87171;font-size:.78rem;margin-bottom:8px;display:none}
    .picker-error.show{display:block}

    /* ── Card List ── */
    .card-list{display:flex;flex-direction:column;gap:12px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px var(--shadow);transition:border-color .2s}
    .card:hover{border-color:var(--border-hover)}

    .card-trigger{width:100%;padding:18px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;text-align:right}
    .card-trigger-content{flex:1}
    .card-trigger-title{font-size:.95rem;font-weight:600;color:var(--text);margin-bottom:4px}
    .card-trigger-range{font-size:.75rem;color:var(--text-3)}
    .card-chevron{color:var(--text-3);font-size:.8rem;margin-top:4px;transition:transform .2s}
    .card.open .card-chevron{transform:rotate(90deg)}

    .card-body{display:none;padding:0 20px 20px}
    .card.open .card-body{display:block}

    /* ── Quran Box ── */
    .quran-box{background:var(--quran-bg);border-right:3px solid var(--emerald);padding:18px;border-radius:10px}
    .quran-text{font-family:'Amiri',serif;line-height:2.4;color:var(--quran-color);text-align:justify}
    .quran-actions{display:flex;gap:6px;margin-top:10px}
    .quran-action-btn{padding:5px 10px;border-radius:6px;font-size:.72rem;color:var(--text-2);border:1px solid var(--border);display:flex;align-items:center;gap:4px;transition:all .2s}
    .quran-action-btn:hover{border-color:var(--emerald);color:var(--emerald)}
    .quran-action-btn.playing{color:var(--emerald);border-color:var(--emerald);background:var(--emerald-dim)}

    /* ── Meaning & Wisdom ── */
    .section-label{font-size:.72rem;font-weight:600;color:var(--text-3);margin:16px 0 6px}
    .meaning{line-height:2;font-size:.92rem;font-weight:300;white-space:pre-line}
    .wisdom{background:var(--gold-dim);border:1px solid var(--gold-border);padding:14px 16px;border-radius:12px;margin-top:16px;color:var(--gold-text);font-size:.88rem;line-height:1.8}
    .wisdom-head{color:var(--gold);font-weight:600;font-size:.8rem;margin-bottom:4px}

    /* ── Card Actions Bar ── */
    .card-actions{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
    .action-pill{padding:6px 12px;border-radius:8px;font-size:.75rem;color:var(--text-2);border:1px solid var(--border);display:flex;align-items:center;gap:4px;transition:all .2s}
    .action-pill:hover{border-color:var(--emerald);color:var(--emerald)}
    .action-pill.bookmarked{color:var(--gold);border-color:var(--gold-border);background:var(--gold-dim)}

    /* ── Reading Mode Overlay ── */
    .reader-overlay{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto}
    .reader-overlay.open{display:block}
    .reader-bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
    .reader-close{font-size:.85rem;color:var(--text-2);display:flex;align-items:center;gap:4px}
    .reader-counter{font-size:.78rem;color:var(--text-3)}
    .reader-body{max-width:680px;margin:0 auto;padding:24px 16px 100px}
    .reader-nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;justify-content:center}
    .reader-nav button{flex:1;max-width:200px;padding:12px;border-radius:10px;font-weight:600;font-size:.85rem}
    .reader-prev{background:var(--surface);color:var(--text);border:1px solid var(--border)}
    .reader-next{background:var(--emerald);color:#fff}
    .reader-nav button:disabled{opacity:.3;cursor:default}

    /* ── Bookmarks Tab ── */
    .empty-state{text-align:center;padding:50px 20px;color:var(--text-3)}
    .empty-state h3{font-weight:500;margin-bottom:6px;color:var(--text-2)}
    .empty-state p{font-size:.88rem}

    /* ── Skeleton ── */
    .skeleton{height:160px;background:var(--border);border-radius:14px;animation:pulse 1.4s infinite}
    @keyframes pulse{0%,100%{opacity:.2}50%{opacity:.5}}

    /* ── Font Size Classes ── */
    .fs-small .quran-text{font-size:1.2rem}
    .fs-small .meaning{font-size:.85rem}
    .fs-normal .quran-text{font-size:1.5rem}
    .fs-normal .meaning{font-size:.92rem}
    .fs-large .quran-text{font-size:1.85rem}
    .fs-large .meaning{font-size:1rem}

    /* ── Mobile ── */
    @media(max-width:640px){
      .picker-grid{grid-template-columns:1fr}
      .hero{padding:20px 16px}
      .topbar{padding:8px 12px}
    }
  </style>
</head>
<body class="fs-normal">

<!-- ── Top Bar ── -->
<div class="topbar">
  <span class="logo">تَدَبُّر</span>
  <div class="topbar-right">
    <button class="icon-btn" onclick="cycleFontSize()" id="fontBtn" title="حجم الخط">   <span id="fontLabel" style="font-weight:700;line-height:1">عـ<sup style="font-size:.55em">+</sup></span> </button>
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="تبديل المظهر">☀️</button>
  </div>
</div>

<div class="app">
  <!-- ── Tabs ── -->
  <div class="tabs">
    <button class="tab active" data-tab="home" onclick="switchTab('home')">الرئيسية</button>
    <button class="tab" data-tab="browse" onclick="switchTab('browse')">التصفح</button>

  </div>

  <!-- ── Home Tab ── -->
  <div id="homeTab">

          <label>من:</label>
          <div class="picker-row">
            <select id="startSurah" onchange="syncEnd()"></select>
            <input type="number" id="startAyah" placeholder="آية" min="1" value="1">

        </div>
        <div>
          <label>إلى:</label>
          <div class="picker-row">
            <select id="endSurah"></select>
            <input type="number" id="endAyah" placeholder="آية" min="1">

    <div id="browseResults" class="card-list"></div>
  </div>

  <!-- ── Bookmarks Tab ── -->
  <div id="bookmarksTab" style="display:none">
    <div id="bookmarkResults" class="card-list"></div>
  </div>
</div>

<!-- ── Reading Mode ── -->
<div class="reader-overlay" id="reader">
  <div class="reader-bar">
    <button class="reader-close" onclick="closeReader()">✕ رجوع</button>
    <span class="reader-counter" id="readerCounter"></span>
  </div>
  <div class="reader-body" id="readerBody"></div>
  <div class="reader-nav">
    <button class="reader-prev" id="readerPrev" onclick="readerNav(-1)">السابق</button>
    <button class="reader-next" id="readerNext" onclick="readerNav(1)">التالي</button>
  </div>
</div>

function getSurah(n){return SURAHS.find(s=>s.n===n)}
function surahName(n){const s=getSurah(n);return s?s.name:''}
function formatRange(it){if(!it.start_surah)return'';if(it.start_surah===it.end_surah){if(it.start_ayah===it.end_ayah)return surahName(it.start_surah)+' '+it.start_ayah;return surahName(it.start_surah)+' '+it.start_ayah+'-'+it.end_ayah}return surahName(it.start_surah)+' '+it.start_ayah+' → '+surahName(it.end_surah)+' '+it.end_ayah}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ─── Supabase ───
const db=supabase.createClient("https://imundmzbhyarqdwlzgnm.supabase.co","sb_publishable_b78kWQraA3NXVfOVe9UNmA_GpnPizjs");

// ─── State ───
let currentTab='home', allResults=[], readerItems=[], readerIdx=0, currentAudio=null;
let bookmarks=JSON.parse(localStorage.getItem('tadabbur-bm')||'[]');
const fontSizes=['fs-small','fs-normal','fs-large'];
let fontIdx=1;

// ─── Init ───
document.addEventListener('DOMContentLoaded',()=>{
  initTheme();populateSelects();loadDaily();
});

// ─── Theme ───
const themes=['dark','light','sepia'];
let themeIdx=0;
function toggleTheme(){
  themeIdx=(themeIdx+1)%3;
  const t=themes[themeIdx];
  localStorage.setItem('tadabbur-theme',t);
  applyTheme(t);
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const icons={dark:'☀️',light:'🌙',sepia:'📖'};
  document.getElementById('themeBtn').textContent=icons[t]||'☀️';
  themeIdx=themes.indexOf(t);
}

// ─── Font Size ───
function cycleFontSize(){
  fontIdx=(fontIdx+1)%3;
  document.body.className=fontSizes[fontIdx];
  const labels=['صغير','متوسط','كبير'];
  const sizes=['0.75em','0.85em','1em'];
  const el=document.getElementById('fontLabel');
  el.style.fontSize=sizes[fontIdx];
  document.getElementById('fontBtn').title='حجم الخط: '+labels[fontIdx];
}
// ─── Selects ───
function populateSelects(){const h=SURAHS.map(s=>`<option value="${s.n}">${s.n}. ${s.name}</option>`).join('');document.getElementById('startSurah').innerHTML=h;document.getElementById('endSurah').innerHTML=h}
function syncEnd(){const s=+document.getElementById('startSurah').value,e=+document.getElementById('endSurah').value;if(e<s)document.getElementById('endSurah').value=s}

// ─── Tabs ───
function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));
  document.getElementById('homeTab').style.display=t==='home'?'':'none';
  document.getElementById('browseTab').style.display=t==='browse'?'':'none';
  document.getElementById('bookmarksTab').style.display=t==='bookmarks'?'':'none';
  if(t==='bookmarks')renderBookmarks();
}

// ─── Daily ───
async function loadDaily(){
  const hero=document.getElementById('dailyHero');
  // Use date as seed for consistent daily pick
  const today=new Date().toISOString().slice(0,10);
  const {count}=await db.from('tadabbur_blocks').select('*',{count:'exact',head:true});
  if(!count){hero.innerHTML='<div class="empty-state"><h3>لا يوجد محتوى بعد</h3></div>';return}
  const seed=[...today].reduce((a,c)=>a+c.charCodeAt(0),0);
  const offset=seed%count;
  const {data}=await db.from('tadabbur_blocks').select('*').range(offset,offset);
  if(!data||!data.length){hero.innerHTML='';return}
  const it=data[0];dailyItem=it;
  hero.innerHTML=`
    <div class="hero-label">✦ تدبر اليوم</div>
    <div class="quran-box"><div class="quran-text">${esc(it.quran_text)}</div></div>
    <div class="hero-title">${esc(it.title)}</div>
    <div class="hero-excerpt">${esc(it.deep_meaning)}</div>
    <button class="hero-cta" onclick="openDaily()">اقرأ التدبر كاملاً</button>
  `;
}

// ─── Validation ───
function validate(){
  const err=document.getElementById('pickerError');err.classList.remove('show');
  const sS=+document.getElementById('startSurah').value,sA=+document.getElementById('startAyah').value||1;
  const eS=+document.getElementById('endSurah').value,eA=+document.getElementById('endAyah').value||getSurah(eS).a;
  if(eS<sS||(eS===sS&&eA<sA)){err.textContent='النهاية لازم تكون بعد البداية';err.classList.add('show');return null}
  const sm=getSurah(sS).a,em=getSurah(eS).a;
  if(sA>sm){err.textContent=`${getSurah(sS).name} فيها ${sm} آية بس`;err.classList.add('show');return null}
  if(eA>em){err.textContent=`${getSurah(eS).name} فيها ${em} آية بس`;err.classList.add('show');return null}
  return{sS,sA,eS,eA}
}

// ─── Browse ───
async function loadRange(){
  const v=validate();if(!v)return;
  const c=document.getElementById('browseResults');
  c.innerHTML='<div class="skeleton"></div>';
  const {data,error}=await db.from('tadabbur_blocks').select('*').gte('end_surah',v.sS).lte('start_surah',v.eS).order('start_surah').order('start_ayah');
  if(error){c.innerHTML='<div class="empty-state"><h3>حصل خطأ</h3></div>';return}
  const filtered=(data||[]).filter(it=>{
    const after=it.start_surah>v.sS||(it.start_surah===v.sS&&it.end_ayah>=v.sA);
    const before=it.end_surah<v.eS||(it.end_surah===v.eS&&it.start_ayah<=v.eA);
    return after&&before;
  });
  allResults=filtered;
  renderCards(filtered,c);
}

  function readTime(text){
  if(!text)return 1;
  const words=text.split(/\s+/).length;
  return Math.max(1,Math.round(words/150));
}

// ─── Render Cards (collapsed) ───
function renderCards(items,container){
  if(!items.length){container.innerHTML='<div class="empty-state"><h3>مفيش تدبرات في النطاق ده</h3><p>جرب تغيّر الآيات</p></div>';return}
  container.innerHTML=items.map((it,i)=>`
    <div class="card" id="card-${it.id}">
      <button class="card-trigger" onclick="toggleCard(${it.id})">
        <div class="card-trigger-content">
          <div class="card-trigger-title">${esc(it.title)}</div>
          <div class="card-trigger-range">${formatRange(it)}</div> <div class="read-time">◷ ${readTime(it.deep_meaning+' '+it.practical_wisdom)} دقائق قراءة</div>
        </div>
        <span class="card-chevron">◂</span>
      </button>
      <div class="card-body">
        <div class="quran-box">
          <div class="quran-text">${esc(it.quran_text)}</div>
          <div class="quran-actions">
            <button class="quran-action-btn" onclick="playAudio(${it.start_global_index},${it.end_global_index},this)">▶ استمع</button>
          </div>
        </div>
        <div class="section-label">الشرح والتأمل</div>
        <div class="meaning">${esc(it.deep_meaning)}</div>
        <div class="wisdom">
          <div class="wisdom-head">التطبيق العملي</div>
          ${esc(it.practical_wisdom)}
        </div>
        <div class="card-actions">
          <button class="action-pill ${bookmarks.includes(it.id)?'bookmarked':''}" onclick="toggleBookmark(${it.id},this)">
            ${bookmarks.includes(it.id)?'★ محفوظ':'☆ احفظ'}
          </button>
          <button class="action-pill" onclick="shareItem(${i})">↗ شارك</button>
          <button class="action-pill" onclick="openReaderAt(${i})">◈ وضع القراءة</button>
        </div>
      </div>
    </div>
  `).join('');
}

// ─── Toggle Card ───
function toggleCard(id){document.getElementById('card-'+id).classList.toggle('open')}

// ─── Audio ───
let audioQueue=[], audioQueueIdx=0, activeAudioBtn=null;

function playAudio(startIdx,endIdx,btn){
  // Stop if already playing
  if(currentAudio){currentAudio.pause();currentAudio=null}
  if(activeAudioBtn){activeAudioBtn.classList.remove('playing');activeAudioBtn.textContent='▶ استمع'}
  if(btn===activeAudioBtn&&btn.classList.contains('playing')){activeAudioBtn=null;return}

  // Build queue of all ayahs in range
  audioQueue=[];
  for(let i=startIdx;i<=endIdx;i++) audioQueue.push(i);
  audioQueueIdx=0;
  activeAudioBtn=btn;
  btn.classList.add('playing');
  btn.textContent='⏸ إيقاف';
  playNext();
}

function playNext(){
  if(audioQueueIdx>=audioQueue.length){
    if(activeAudioBtn){activeAudioBtn.classList.remove('playing');activeAudioBtn.textContent='▶ استمع'}
    activeAudioBtn=null;currentAudio=null;return;
  }
  const idx=audioQueue[audioQueueIdx];
  const url=`https://cdn.islamic.network/quran/audio/128/ar.alafasy/${idx}.mp3`;
  currentAudio=new Audio(url);
  currentAudio.play().catch(()=>{});
  currentAudio.onended=()=>{audioQueueIdx++;playNext()};
  currentAudio.onerror=()=>{audioQueueIdx++;playNext()};
}

// ─── Bookmarks ───
function toggleBookmark(id,btn){
  const idx=bookmarks.indexOf(id);
  if(idx>-1){bookmarks.splice(idx,1);btn.classList.remove('bookmarked');btn.textContent='☆ احفظ'}
  else{bookmarks.push(id);btn.classList.add('bookmarked');btn.textContent='★ محفوظ'}
  localStorage.setItem('tadabbur-bm',JSON.stringify(bookmarks));
}
async function renderBookmarks(){
  const c=document.getElementById('bookmarkResults');
  if(!bookmarks.length){c.innerHTML='<div class="empty-state"><h3>مفيش محفوظات لسه</h3><p>اضغط "احفظ" على أي تدبر عشان يظهر هنا</p></div>';return}
  c.innerHTML='<div class="skeleton"></div>';
  const {data}=await db.from('tadabbur_blocks').select('*').in('id',bookmarks);
  allResults=data||[];
  renderCards(allResults,c);
}

// ─── Share ───
let dailyItem=null;

function shareItem(idx){doShare(allResults[idx])}
function shareReader(){doShare(readerItems[readerIdx])}

async function doShare(it){
  if(!it)return;
  const text=`✦ ${it.title}\n\n﴿${it.quran_text}﴾\n\n${it.deep_meaning.substring(0,300)}...\n\n💡 ${it.practical_wisdom.substring(0,200)}...\n\n— تطبيق تدبّر`;
  if(navigator.share){try{await navigator.share({title:it.title,text})}catch(e){}}
  else{try{await navigator.clipboard.writeText(text);alert('تم النسخ ✓')}catch(e){prompt('انسخ النص:',text)}}
}

// ─── Reader Mode ───
function openDaily(){
  if(!dailyItem)return;
  readerItems=[dailyItem];readerIdx=0;
  document.getElementById('reader').classList.add('open');
  document.body.style.overflow='hidden';
  renderReader();
}
function openReaderAt(idx){
  readerItems=allResults;readerIdx=idx;
  document.getElementById('reader').classList.add('open');
  document.body.style.overflow='hidden';
  renderReader();
}
function openReaderSingle(it){
  readerItems=[it];readerIdx=0;
  document.getElementById('reader').classList.add('open');
  document.body.style.overflow='hidden';
  renderReader();
}
function closeReader(){
  document.getElementById('reader').classList.remove('open');
  document.body.style.overflow='';
  if(currentAudio){currentAudio.pause();currentAudio=null}
}
function readerNav(dir){
  readerIdx+=dir;
  if(readerIdx<0)readerIdx=0;
  if(readerIdx>=readerItems.length)readerIdx=readerItems.length-1;
  renderReader();
  document.getElementById('reader').scrollTop=0;
}
function renderReader(){
  const it=readerItems[readerIdx];
  document.getElementById('readerCounter').textContent=`${readerIdx+1} / ${readerItems.length}`;
  document.getElementById('readerPrev').disabled=readerIdx===0;
  document.getElementById('readerNext').disabled=readerIdx===readerItems.length-1;
  document.getElementById('readerBody').innerHTML=`
    <div style="margin-bottom:20px">
      <h2 style="font-size:1.15rem;font-weight:600;color:var(--emerald);margin-bottom:4px">${esc(it.title)}</h2>
      <span style="font-size:.78rem;color:var(--text-3)">${formatRange(it)} · ◷ ${readTime(it.deep_meaning+' '+it.practical_wisdom)} د</span>
    </div>
    <div class="quran-box" style="margin-bottom:24px">
      <div class="quran-text">${esc(it.quran_text)}</div>
      <div class="quran-actions" style="margin-top:10px">
        <button class="quran-action-btn" onclick="playAudio(${it.start_global_index},${it.end_global_index},this)">▶ استمع</button>
      </div>
    </div>
    <div class="meaning" style="margin-bottom:24px">${esc(it.deep_meaning)}</div>
    <div class="wisdom">
      <div class="wisdom-head">التطبيق العملي</div>
      ${esc(it.practical_wisdom)}
    </div>
    <div class="card-actions" style="margin-top:20px;padding-top:14px;border-top:1px solid var(--border)">
      <button class="action-pill ${bookmarks.includes(it.id)?'bookmarked':''}" onclick="toggleBookmark(${it.id},this)">
        ${bookmarks.includes(it.id)?'★ محفوظ':'☆ احفظ'}
      </button>
      <button class="action-pill" onclick="shareReader()">↗ شارك</button>
    </div>
  `;
}
// ─── Swipe Gestures ───
let touchStartX=0, touchEndX=0;
document.getElementById('reader').addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].screenX},{passive:true});
document.getElementById('reader').addEventListener('touchend',e=>{
  touchEndX=e.changedTouches[0].screenX;
  const diff=touchStartX-touchEndX;
  if(Math.abs(diff)>80){
    if(diff>0) readerNav(1);  // swipe left = next
    else readerNav(-1);       // swipe right = prev
  }
},{passive:true});

  
  
</script>
