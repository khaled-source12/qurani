<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تَدَبُّر — منصة التدبر القرآني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root[data-theme="dark"] {
      --bg-main: #0a1214;
      --bg-surface: #111d21;
      --card-bg: rgba(18, 36, 40, 0.8);
      --card-border: rgba(255,255,255,0.06);
      --emerald: #10b981;
      --emerald-dim: rgba(16,185,129,0.12);
      --gold: #f59e0b;
      --gold-dim: rgba(245,158,11,0.08);
      --gold-border: rgba(245,158,11,0.2);
      --gold-text: #fef3c7;
      --text: #f0f2f4;
      --text-secondary: #8b949e;
      --quran-text: #d1fae5;
      --quran-bg: rgba(16,185,129,0.05);
      --input-bg: rgba(10,18,20,0.9);
      --shadow: rgba(0,0,0,0.4);
      --error: #f87171;
    }
    :root[data-theme="light"] {
      --bg-main: #f5f7f6;
      --bg-surface: #edf0ef;
      --card-bg: #ffffff;
      --card-border: rgba(0,0,0,0.07);
      --emerald: #059669;
      --emerald-dim: rgba(5,150,105,0.1);
      --gold: #b45309;
      --gold-dim: #fef9e7;
      --gold-border: #fcd34d;
      --gold-text: #713f12;
      --text: #1a2024;
      --text-secondary: #5f6b73;
      --quran-text: #064e3b;
      --quran-bg: #f0fdf8;
      --input-bg: #f8faf9;
      --shadow: rgba(0,0,0,0.05);
      --error: #dc2626;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Readex Pro', sans-serif;
      background: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 60px;
      display: flex;
      justify-content: center;
      transition: background 0.35s, color 0.35s;
    }
    .container { width: 100%; max-width: 820px; }

    /* Top bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .logo {
      padding: 5px 14px;
      background: var(--emerald-dim);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      border-radius: 18px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .theme-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 18px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.25s;
    }
    .theme-btn:hover { border-color: var(--emerald); }

    /* Header */
    header { text-align: center; margin-bottom: 28px; }
    h1 { font-size: 2.1rem; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: var(--text-secondary); font-size: 0.92rem; font-weight: 300; }

    /* Range panel */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 8px 30px var(--shadow);
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .range-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--emerald);
      margin-bottom: 5px;
      display: block;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .range-row {
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 8px;
    }
    select, input[type="number"] {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      width: 100%;
      transition: border-color 0.25s, box-shadow 0.25s;
      -moz-appearance: textfield;
    }
    select:focus, input:focus {
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px var(--emerald-dim);
    }
    input[type="number"]::-webkit-inner-spin-button { opacity: 1; }

    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 11px 18px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 0.88rem;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--emerald); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-ghost {
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    .btn-ghost:hover { border-color: var(--emerald); }

    .error-msg {
      color: var(--error);
      font-size: 0.82rem;
      font-weight: 500;
      display: none;
    }
    .error-msg.show { display: block; }

    /* Results */
    .results { display: flex; flex-direction: column; gap: 22px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 6px 24px var(--shadow);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }
    .card-title { font-size: 1.1rem; font-weight: 600; color: var(--emerald); }

    .quran-box {
      background: var(--quran-bg);
      border-right: 3px solid var(--emerald);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .quran-text {
      font-family: 'Amiri', serif;
      font-size: 1.55rem;
      line-height: 2.4;
      color: var(--quran-text);
      text-align: justify;
    }

    .section-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .meaning {
      line-height: 1.95;
      font-size: 0.98rem;
      font-weight: 300;
      margin-bottom: 18px;
      white-space: pre-line;
    }

    .wisdom {
      background: var(--gold-dim);
      border: 1px solid var(--gold-border);
      padding: 16px;
      border-radius: 12px;
      color: var(--gold-text);
      font-size: 0.92rem;
      line-height: 1.75;
    }
    .wisdom-head { color: var(--gold); font-weight: 600; margin-bottom: 4px; }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px dashed var(--card-border);
      color: var(--text-secondary);
    }
    .empty h3 { margin-bottom: 6px; font-weight: 500; }

    .skeleton {
      height: 200px;
      background: var(--card-border);
      border-radius: 18px;
      animation: pulse 1.4s infinite ease-in-out;
    }
    @keyframes pulse {
      0%,100% { opacity: 0.25; }
      50% { opacity: 0.6; }
    }

    .count-badge {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    @media (max-width: 640px) {
      .filter-grid { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      h1 { font-size: 1.7rem; }
      .quran-text { font-size: 1.3rem; }
      .card { padding: 20px; }
      .range-row { grid-template-columns: 1fr 80px; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="top-bar">
    <span class="logo">تدبّر</span>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️ الوضع الفاتح</button>
  </div>

  <header>
    <h1>تَدَبُّر آيَاتِ القُرْآن</h1>
    <p class="subtitle">تأملات ومعانٍ عملية بالعامية المصرية</p>
  </header>

  <div class="panel">
    <div class="filter-grid">
      <div>
        <label class="range-label">من:</label>
        <div class="range-row">
          <select id="startSurah" onchange="syncEnd()"></select>
          <input type="number" id="startAyah" placeholder="آية" min="1" value="1">
        </div>
      </div>
      <div>
        <label class="range-label">إلى:</label>
        <div class="range-row">
          <select id="endSurah"></select>
          <input type="number" id="endAyah" placeholder="آية" min="1">
        </div>
      </div>
    </div>

    <p class="error-msg" id="errorMsg"></p>

    <div class="actions">
      <button class="btn btn-primary" onclick="loadRange()">عرض التدبر</button>
      <button class="btn btn-ghost" onclick="loadRandom()">🎲 مقطع عشوائي</button>
    </div>
  </div>

  <div id="results" class="results"></div>
</div>

<script>
// ─── Surah Data ───

  {n:76,name:"الإنسان",ayahs:31},{n:77,name:"المرسلات",ayahs:50},{n:78,name:"النبأ",ayahs:40},
  {n:79,name:"النازعات",ayahs:46},{n:80,name:"عبس",ayahs:42},{n:81,name:"التكوير",ayahs:29},
  {n:82,name:"الانفطار",ayahs:19},{n:83,name:"المطففين",ayahs:36},{n:84,name:"الانشقاق",ayahs:25},
  {n:85,name:"البروج",ayahs:22},{n:86,name:"الطارق",ayahs:17},{n:87,name:"الأعلى",ayahs:19},
  {n:88,name:"الغاشية",ayahs:26},{n:89,name:"الفجر",ayahs:30},{n:90,name:"البلد",ayahs:20},
  {n:91,name:"الشمس",ayahs:15},{n:92,name:"الليل",ayahs:21},{n:93,name:"الضحى",ayahs:11},
  {n:94,name:"الشرح",ayahs:8},{n:95,name:"التين",ayahs:8},{n:96,name:"العلق",ayahs:19},
  {n:97,name:"القدر",ayahs:5},{n:98,name:"البينة",ayahs:8},{n:99,name:"الزلزلة",ayahs:8},
  {n:100,name:"العاديات",ayahs:11},{n:101,name:"القارعة",ayahs:11},{n:102,name:"التكاثر",ayahs:8},
  {n:103,name:"العصر",ayahs:3},{n:104,name:"الهمزة",ayahs:9},{n:105,name:"الفيل",ayahs:5},
  {n:106,name:"قريش",ayahs:4},{n:107,name:"الماعون",ayahs:7},{n:108,name:"الكوثر",ayahs:3},
  {n:109,name:"الكافرون",ayahs:6},{n:110,name:"النصر",ayahs:3},{n:111,name:"المسد",ayahs:5},
  {n:112,name:"الإخلاص",ayahs:4},{n:113,name:"الفلق",ayahs:5},{n:114,name:"الناس",ayahs:6}
];

function getSurah(n) { return SURAHS.find(s => s.n === n); }

// ─── Supabase ───
const SUPABASE_URL = "https://imundmzbhyarqdwlzgnm.supabase.co";
const SUPABASE_KEY = "sb_publishable_b78kWQraA3NXVfOVe9UNmA_GpnPizjs";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── Init ───
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  populateSelects();
  loadRange();
});

// ─── Theme ───
function initTheme() {
  const t = localStorage.getItem('tadabbur-theme') || 'dark';
  applyTheme(t);
}
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('tadabbur-theme', next);
  applyTheme(next);
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️ الوضع الفاتح' : '🌙 الوضع الداكن';
}

// ─── Populate selects with 114 surahs ───
function populateSelects() {
  const html = SURAHS.map(s => `<option value="${s.n}">${s.n}. ${s.name}</option>`).join('');
  document.getElementById('startSurah').innerHTML = html;
  document.getElementById('endSurah').innerHTML = html;
}

// Keep end >= start when user changes start
function syncEnd() {
  const startN = parseInt(document.getElementById('startSurah').value);
  const endN = parseInt(document.getElementById('endSurah').value);
  if (endN < startN) document.getElementById('endSurah').value = startN;
}

// ─── Validation ───
function validate() {
  const errEl = document.getElementById('errorMsg');
  errEl.classList.remove('show');

  const sS = parseInt(document.getElementById('startSurah').value);
  const sA = parseInt(document.getElementById('startAyah').value) || 1;
  const eS = parseInt(document.getElementById('endSurah').value);
  const eA = parseInt(document.getElementById('endAyah').value) || getSurah(eS).ayahs;

  // Range direction
  if (eS < sS || (eS === sS && eA < sA)) {
    errEl.textContent = 'نقطة النهاية لازم تكون بعد نقطة البداية';
    errEl.classList.add('show');
    return null;
  }

  // Ayah bounds
  const startMax = getSurah(sS).ayahs;
  const endMax = getSurah(eS).ayahs;
  if (sA > startMax) {
    errEl.textContent = `سورة ${getSurah(sS).name} فيها ${startMax} آية بس`;
    errEl.classList.add('show');
    return null;
  }
  if (eA > endMax) {
    errEl.textContent = `سورة ${getSurah(eS).name} فيها ${endMax} آية بس`;
    errEl.classList.add('show');
    return null;
  }

  return { sS, sA, eS, eA };
}

// ─── Load range ───
async function loadRange() {
  const v = validate();
  if (!v) return;

  const container = document.getElementById('results');
  container.innerHTML = '<div class="skeleton"></div>';

  let query = db.from('tadabbur_blocks').select('*')
    .gte('end_surah', v.sS)
    .lte('start_surah', v.eS)
    .order('start_surah', { ascending: true })
    .order('start_ayah', { ascending: true });

  const { data, error } = await query;

  if (error) {
    container.innerHTML = '<div class="empty"><h3>حصل خطأ في تحميل البيانات</h3><p>جرب تاني بعد شوية</p></div>';
    return;
  }

  // Local filter for ayah boundaries
  const filtered = (data || []).filter(item => {
    const afterStart = item.start_surah > v.sS || (item.start_surah === v.sS && item.end_ayah >= v.sA);
    const beforeEnd = item.end_surah < v.eS || (item.end_surah === v.eS && item.start_ayah <= v.eA);
    return afterStart && beforeEnd;
  });

  render(filtered);
}

// ─── Random: fetch just count then pick offset ───
async function loadRandom() {
  const container = document.getElementById('results');
  container.innerHTML = '<div class="skeleton"></div>';
  document.getElementById('errorMsg').classList.remove('show');

  // Get total count first
  const { count, error: cErr } = await db
    .from('tadabbur_blocks')
    .select('*', { count: 'exact', head: true });

  if (cErr || !count) {
    container.innerHTML = '<div class="empty"><h3>مفيش مقاطع متوفرة دلوقتي</h3></div>';
    return;
  }

  const offset = Math.floor(Math.random() * count);
  const { data, error } = await db
    .from('tadabbur_blocks')
    .select('*')
    .range(offset, offset);

  if (error || !data || data.length === 0) {
    container.innerHTML = '<div class="empty"><h3>مفيش مقاطع متوفرة دلوقتي</h3></div>';
    return;
  }

  render(data);
}

// ─── Render ───
function render(items) {
  const container = document.getElementById('results');

  if (!items || items.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <h3>مفيش تدبرات في النطاق ده لسه</h3>
        <p>جرب تغيّر السورة أو رقم الآية</p>
      </div>`;
    return;
  }

  container.innerHTML = items.map(item => `
    <article class="card">
      <div class="card-head">
        <span class="card-title">${esc(item.title)}</span>
        <span class="count-badge">${formatRange(item)}</span>
      </div>
      <div class="quran-box">
        <div class="quran-text">${esc(item.quran_text)}</div>
      </div>
      <p class="section-label">الشرح والتأمل</p>
      <p class="meaning">${esc(item.deep_meaning)}</p>
      <div class="wisdom">
        <p class="wisdom-head">التطبيق العملي</p>
        <div>${esc(item.practical_wisdom)}</div>
      </div>
    </article>
  `).join('');
}

// ─── Helpers ───
function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function formatRange(item) {
  if (!item.start_surah) return '';
  const s = getSurah(item.start_surah);
  const e = getSurah(item.end_surah);
  if (!s) return '';
  if (item.start_surah === item.end_surah) {
    if (item.start_ayah === item.end_ayah) return `${s.name} ${item.start_ayah}`;
    return `${s.name} ${item.start_ayah}-${item.end_ayah}`;
  }
  return `${s.name} ${item.start_ayah} → ${e ? e.name : ''} ${item.end_ayah}`;
}
</script>

</html>
