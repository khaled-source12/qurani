<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد التدبر القرآني</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; color: #222; padding: 20px; max-width: 800px; margin: auto; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .quran { font-size: 1.3rem; color: #1b4332; background: #e8f5e9; padding: 15px; border-radius: 8px; line-height: 2; }
    .title { color: #2d6a4f; margin-top: 0; }
    .wisdom { background: #fff3cd; padding: 12px; border-right: 4px solid #ffc107; border-radius: 4px; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>✨ مولد التدبر القرآني</h1>
  <div id="content">جاري تحميل البيانات...</div>

  <script>
    const SUPABASE_URL = "https://imundmzbhyarqdwlzgnm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_b78kWQraA3NXVfOVe9UNmA_GpnPizjs";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadTadabbur() {
      const { data, error } = await _supabase.from('tadabbur_blocks').select('*');
      const container = document.getElementById('content');
      
      if (error) {
        container.innerHTML = "حدث خطأ في تحميل البيانات";
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="card">
          <h2 class="title">${item.title}</h2>
          <div class="quran">${item.quran_text}</div>
          <h3>💡 المعنى والتدبر:</h3>
          <p>${item.deep_meaning}</p>
          <div class="wisdom">${item.practical_wisdom}</div>
        </div>
      `).join('');
    }

    loadTadabbur();
  </script>
</body>
</html>
