<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تَدَبُّر — منصة التدبر القرآني</title>
  
  <!-- الخطوط والأيقونات -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-main: #0d1b1e;
      --card-bg: rgba(22, 42, 45, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.15);
      --accent-gold: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --quran-text: #ecfdf5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Readex Pro', sans-serif;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    /* Header Design */
    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-tag {
      display: inline-block;
      padding: 6px 16px;
      background: var(--emerald-glow);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--primary-emerald);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Search & Filter Bar */
    .search-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
    }

    select, input {
      background: rgba(13, 27, 30, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, input:focus {
      border-color: var(--primary-emerald);
      box-shadow: 0 0 0 3px var(--emerald-glow);
    }

    .actions-grid {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary-emerald);
      color: #0d1b1e;
    }

    .btn-primary:hover {
      background: #34d399;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    /* Results Cards */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .tadabbur-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .tadabbur-card:hover {
      border-color: rgba(16, 185, 129, 0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--primary-emerald);
    }

    .quran-box {
      background: rgba(16, 185, 129, 0.05);
      border-right: 4px solid var(--primary-emerald);
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    .quran-text {
      font-family: 'Amiri', serif;
      font-size: 1.6rem;
      line-height: 2.3;
      color: var(--quran-text);
      text-align: justify;
    }

    .section-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meaning-text {
      line-height: 1.9;
      color: #e5e7eb;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 300;
    }

    .wisdom-box {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      padding: 16px;
      border-radius: 14px;
      color: #fef3c7;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .wisdom-title {
      color: var(--accent-gold);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px dashed var(--card-border);
      color: var(--text-muted);
    }

    /* Skeleton Loading */
    .skeleton {
      animation: pulse 1.5s infinite ease-in-out;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    @media (max-width: 640px) {
      .filter-grid { grid-template-columns: 1fr; }
      .actions-grid { flex-direction: column; }
      h1 { font-size: 1.8rem; }
      .quran-text { font-size: 1.35rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <span class="logo-tag">تطبيق تدبر الذكي</span>
      <h1>تَدَبُّر آيَاتِ القُرْآن</h1>
      <p class="subtitle">تأملات ومعانٍ عملية بالعامية المصرية الراقية</p>
    </header>

    <!-- Search / Filter Area -->
    <div class="search-panel">
      <div class="filter-grid">
        <select id="surahSelect" onchange="searchTadabbur()">
          <option value="all">📖 كل السور المتاحة</option>
          <option value="1">1. الفاتحة</option>
          <option value="2">2. البقرة</option>
        </select>
        <input type="number" id="ayahInput" placeholder="رقم الآية" min="1" oninput="searchTadabbur()">
        <input type="text" id="searchInput" placeholder="بحث بكلمة..." oninput="searchTadabbur()">
      </div>
      <div class="actions-grid">
        <button class="btn btn-primary" onclick="searchTadabbur()">
          🔍 عرض النتائج
        </button>
        <button class="btn btn-secondary" onclick="fetchRandom()">
          🎲 مقطع عشوائي
        </button>
      </div>
    </div>

    <!-- Results Display Area -->
    <div id="content" class="results-container"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://imundmzbhyarqdwlzgnm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_b78kWQraA3NXVfOVe9UNmA_GpnPizjs";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Dynamic initial load
    document.addEventListener('DOMContentLoaded', searchTadabbur);

    async function searchTadabbur() {
      const container = document.getElementById('content');
      showSkeleton(container);

      const surahVal = document.getElementById('surahSelect').value;
      const ayahVal = parseInt(document.getElementById('ayahInput').value);
      const searchKeyword = document.getElementById('searchInput').value.trim();

      let query = _supabase.from('tadabbur_blocks').select('*');

      if (surahVal !== 'all') {
        query = query.eq('start_surah', parseInt(surahVal));
      }

      if (!isNaN(ayahVal)) {
        query = query.lte('start_ayah', ayahVal).gte('end_ayah', ayahVal);
      }

      if (searchKeyword !== "") {
        query = query.ilike('deep_meaning', `%${searchKeyword}%`);
      }

      const { data, error } = await query;

      if (error) {
        container.innerHTML = `
          <div class="empty-state">
            <p>❌ حدث خطأ في جلب البيانات، يرجى المحاولة مرة أخرى.</p>
          </div>`;
        return;
      }

      renderResults(data);
    }

    async function fetchRandom() {
      const container = document.getElementById('content');
      showSkeleton(container);

      const { data, error } = await _supabase.from('tadabbur_blocks').select('*');

      if (error || !data || data.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>لا توجد مقاطع تدبر متوفرة حالياً.</p>
          </div>`;
        return;
      }

      const randomBlock = [data[Math.floor(Math.random() * data.length)]];
      renderResults(randomBlock);
    }

    function renderResults(data) {
      const container = document.getElementById('content');

      if (!data || data.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>لم نجد نتائج مطابقة</h3>
            <p style="margin-top: 8px;">جرب تغيير السورة، رقم الآية، أو كلمة البحث.</p>
          </div>`;
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="tadabbur-card">
          <div class="card-header">
            <div class="card-title">${item.title}</div>
          </div>
          
          <div class="quran-box">
            <div class="quran-text">${item.quran_text}</div>
          </div>

          <div class="section-title">✨ الشرح والتأمل العميق</div>
          <p class="meaning-text">${item.deep_meaning}</p>

          <div class="wisdom-box">
            <div class="wisdom-title">💡 العمل بالآية والتطبيق اليومي:</div>
            <div>${item.practical_wisdom}</div>
          </div>
        </div>
      `).join('');
    }

    function showSkeleton(container) {
      container.innerHTML = `
        <div class="tadabbur-card skeleton" style="height: 250px;"></div>
        <div class="tadabbur-card skeleton" style="height: 250px;"></div>
      `;
    }
  </script>
</body>
</html>
